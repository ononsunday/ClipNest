[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipnest"
version = "0.1.0"
description = "Local Windows clipboard history manager built with PySide6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.11.2",
  "Pygments==2.21.0",
]

[project.gui-scripts]
clipnest = "clipnest.app:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "PyInstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clipnest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "windows: Windows system API tests",
  "gui: Qt application or window tests",
]
